name: Precio en vivo

on:
  schedule:
    # Cada 5 minutos, de domingo a viernes. El script no hace nada si el mercado está cerrado.
    - cron: "*/5 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

# Cada ejecución nueva reemplaza a la anterior: el precio siempre lo publica la más reciente.
concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Publicar el precio cada minuto en la rama live
        run: python scripts/live_loop.py 330 60

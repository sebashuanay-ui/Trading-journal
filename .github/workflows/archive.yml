name: Archivo diario de precios

on:
  schedule:
    # 22:30 UTC de lunes a viernes: después del cierre de CME en horario de verano e invierno.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Guardar las últimas sesiones en data/
        run: python scripts/update_data.py 5
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Archivo diario de precios MNQ"
            git push
          fi
